 const sc=c=>`<button class="sw ${(s?s.stroke:stroke)===c?'on':''}" data-s="${c}" style="background:${c==='auto'?'var(--ink)':c}"></button>`,fc=c=>`<button class="sw ${(s?s.fill:fill)===c?'on':''}" data-f="${c}" style="background:${c==='none'?'repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px)':c}"></button>`;
 $('#props').innerHTML=SC.map(sc).join('')+'<span class="sep"></span>'+FC.map(fc).join('')+'<span class="sep"></span>'+[1,2,4].map(w=>`<button class="wb ${(s?s.sw:sw)===w?'on':''}" data-w="${w}">${w===1?'─':w===2?'━':'▬'}</button>`).join('')+
 '<span class="sep"></span><label class="rgl" title="Sketchiness: 0 = clean, 3 = very messy">✎<input type="range" id="rgs" min="0" max="3" step="0.5" value="'+(s&&s.rg!=null?s.rg:rough)+'"></label>'+dssHTML(s)+((s&&s.t==='arrow')||tool==='arrow'?ahHTML(s):'')+'<span class="sep"></span>'+[['S',18],['M',24],['L',36],['XL',52]].map(x=>`<button class="wb ${(s&&s.t==='text'?s.fs||24:tfs)===x[1]?'on':''}" data-fs="${x[1]}" title="Text size">${x[0]}</button>`).join('')+'<select id="ffs" title="Font">'+Object.keys(FF).map(k=>`<option value="${k}" ${((s&&s.t==='text'?s.ff:tff)||'hand')===k?'selected':''}>${k[0].toUpperCase()+k.slice(1)}</option>`).join('')+'</select><span class="sep"></span><button class="wb" data-a="u" title="Undo (Ctrl+Z)">↶</button><button class="wb" data-a="r" title="Redo">↷</button>'+ALN()+'<button class="wb '+(cur().length&&cur().every(q=>q.lk)?'on':'')+'" data-a="lock" title="Lock / unlock">🔒</button><button class="wb" data-a="dup" title="Duplicate (Ctrl+D)">⧉</button><button class="wb" data-a="fr" title="Bring to front (])">⤒</button><button class="wb" data-a="bk" title="Send to back ([)">⤓</button><button class="wb" data-a="del" title="Delete">🗑</button><span class="sep"></span><button class="wb" data-a="fit" title="Fit to content">⤢</button><button class="wb" data-a="zo">−</button><span id="zoomv" style="min-width:42px;text-align:center"></span><button class="wb" data-a="zi">+</button><button class="wb '+(snap?'on':'')+'" data-a="sn" title="Snapping">🧲</button><button class="wb" data-a="pg" title="Page style">▦</button><button class="wb" data-a="th" title="Light / dark">◐</button>';draw()}
$('#props').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,s=P().els.find(x=>x.id===sel),v=P().v;
 if(d.s){stroke=d.s;cur().forEach(q=>q.stroke=d.s)}if(d.f){fill=d.f;cur().forEach(q=>q.fill=d.f)}if(d.w){sw=+d.w;cur().forEach(q=>q.sw=sw)}
 if(d.a==='u')undo(-1);if(d.a==='r')undo(1);if(d.a==='del')del();
 if(d.a==='zi'||d.a==='zo'){const z=Math.max(.2,Math.min(4,v.z*(d.a==='zi'?1.2:1/1.2))),cx=cv.clientWidth/2,cy=cv.clientHeight/2;v.x=cx-(cx-v.x)*z/v.z;v.y=cy-(cy-v.y)*z/v.z;v.z=z;save()}
 if(d.a==='th'){const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()==='#14171d';r.dataset.theme=dk?'light':'dark'}
 if(d.a==='sn')snap=!snap;if(d.a==='pg'){pgpop();return}
 if(d.al){align(d.al);return}if(d.a==='lock'){const c=cur(),v=!c.every(q=>q.lk);c.forEach(q=>q.lk=v||undefined);commit();props();return}if(d.a==='fit'){fitAll();props();return}if(d.a==='dup'){dupe();return}if(d.a==='fr'||d.a==='bk'){zord(d.a==='fr'?1:-1);return}
 if(d.fs){tfs=+d.fs;cur().forEach(q=>{if(q.t==='text'){q.fs=tfs;tfit(q)}})}
 if(d.s||d.f||d.w||d.fs)commit();props()};
$('#props').addEventListener('input',e=>{if(e.target.id!=='rgs')return;rough=+e.target.value;const s=P().els.find(q=>q.id===sel);if(s&&!['text','math','free'].includes(s.t)){s.rg=rough;draw()}});
$('#props').addEventListener('change',e=>{if(e.target.id==='rgs'&&P().els.find(q=>q.id===sel))commit()});
function pgpop(){const p=P(),h=$('#pgpop');h.hidden=!h.hidden;if(h.hidden)return;h.innerHTML='<b>Sheet</b><div>'+[['inf','Infinite'],['a4','A4 vertical']].map(x=>`<button class="b ${(p.mode||'inf')===x[0]?'on':''}" data-pm="${x[0]}">${x[1]}</button>`).join('')+'</div><b>Background</b><div>'+BG.map(c=>`<button class="sw ${(p.bg||'auto')===c?'on':''}" data-pb="${c}" style="background:${c==='auto'?'var(--bg)':c}"></button>`).join('')+'</div><b>Pattern</b><div>'+[['none','Blank'],['dots','Dots'],['lines','Lines'],['squares','Squares']].map(x=>`<button class="b ${(p.pat||'dots')===x[0]?'on':''}" data-pp="${x[0]}">${x[1]}</button>`).join('')+'</div>'}
$('#pgpop').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=P();if(b.dataset.pm){p.mode=b.dataset.pm;if(p.mode==='a4')fitA4(p)}if(b.dataset.pb)p.bg=b.dataset.pb;if(b.dataset.pp)p.pat=b.dataset.pp;save();$('#pgpop').hidden=true;pgpop();draw();props()};
function del(){const ids=msel.length?msel:sel?[sel]:[];if(!ids.length)return;P().els=P().els.filter(e=>!ids.includes(e.id));sel=null;msel=[];commit();props()}
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(e.code==='Space'){space=true;e.preventDefault();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo(e.shiftKey?1:-1);return}
 const mk=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
 if(mk&&k==='a'){e.preventDefault();selIds(P().els.map(q=>q.id));draw();props();return}
 if(mk&&(k==='c'||k==='x'||k==='d')){e.preventDefault();const c=cur();if(!c.length)return;if(k==='d'){dupe();return}window._clip=JSON.stringify(c);if(k==='x')del();return}
 if(e.key==='Escape'){sel=null;msel=[];draw();props();return}
 if(e.key===']'||e.key==='['){zord(e.key===']'?1:-1);return}
 if(e.key==='Delete'||e.key==='Backspace'){del();return}
 const m={v:'select',r:'rect',d:'diamond',o:'ellipse',a:'arrow',l:'line',p:'free',t:'text',m:'math',e:'eraser',h:'hand'}[e.key.toLowerCase()];if(m&&!e.ctrlKey&&!e.metaKey){e.preventDefault();setTool(m)}});
addEventListener('keyup',e=>{if(e.code==='Space')space=false});
/* sidebar */
function side(){$('#tree').innerHTML=S.nbs.map(n=>`<div class="nb" data-n="${n.id}"><span>${n.open?'▾':'▸'}</span>${ren===n.id?`<input data-r="${n.id}" value="${esc(n.name)}">`:`<span class="nm" data-rn="${n.id}">${esc(n.name)}</span>`}<button class="add" data-ap="${n.id}" title="New page">+</button>${S.nbs.length>1?`<button class="x" data-dn="${n.id}" title="Delete notebook">×</button>`:''}</div>`+
 (n.open?n.pages.map(p=>`<div class="pg ${p.id===S.cur?'on':''}" data-p="${p.id}">${ren===p.id?`<input data-r="${p.id}" value="${esc(p.name)}">`:`<span class="nm" data-rn="${p.id}">${esc(p.name)}</span>`}${n.pages.length>1?`<button class="x" data-dp="${p.id}" title="Delete page">×</button>`:''}</div>`).join(''):'')).join('');
 const i=$('#tree input');if(i){i.focus();i.select()}}
$('#tree').onclick=e=>{const t=e.target,d=t.closest('[data-dn],[data-dp],[data-ap]');
 if(t.closest('input'))return;
 if(t.dataset.ap){const n=S.nbs.find(x=>x.id===t.dataset.ap),p={id:uid(),name:'Page '+(n.pages.length+1),els:[],v:{x:0,y:0,z:1}};n.pages.push(p);n.open=true;S.cur=p.id;save();return load()}
 if(t.dataset.dn){binNb(t.dataset.dn);S.nbs=S.nbs.filter(n=>n.id!==t.dataset.dn);if(!P()){S.cur=S.nbs[0].pages[0].id}save();return load()}
 if(t.dataset.dp){const n=S.nbs.find(n=>n.pages.some(p=>p.id===t.dataset.dp));binPg(n,t.dataset.dp);n.pages=n.pages.filter(p=>p.id!==t.dataset.dp);if(!P())S.cur=n.pages[0].id;save();return load()}
 const pg=t.closest('[data-p]');if(pg){S.cur=pg.dataset.p;save();return load()}
 const nb=t.closest('[data-n]');if(nb){const n=S.nbs.find(x=>x.id===nb.dataset.n);n.open=!n.open;save();side()}};
$('#tree').ondblclick=e=>{const id=e.target.dataset.rn;if(id){ren=id;side()}};
function endRename(i){const id=i.dataset.r,v=i.value.trim();ren=null;for(const n of S.nbs){if(n.id===id&&v)n.name=v;for(const p of n.pages)if(p.id===id&&v)p.name=v}save();$('#pgname').textContent=P().name;side();if(S.view!=='page')home()}
$('#tree').addEventListener('focusout',e=>{if(e.target.dataset.r&&ren)endRename(e.target)});
$('#tree').addEventListener('keydown',e=>{if(e.target.dataset.r&&(e.key==='Enter'||e.key==='Escape'))e.key==='Enter'?endRename(e.target):(ren=null,side())});
$('#newnb').onclick=()=>{const p={id:uid(),name:'Page 1',els:[],v:{x:0,y:0,z:1}};S.nbs.push({id:uid(),name:'Notebook '+(S.nbs.length+1),open:true,pages:[p]});S.cur=p.id;save();load()};
$('#srch').addEventListener('input',()=>{const q=$('#srch').value.trim().toLowerCase();if(!q){side();return}const R=[];
 S.nbs.forEach(n=>n.pages.forEach(p=>{let sn=null;const nm=(n.name+' '+p.name).toLowerCase().includes(q);for(const e of p.els){const t=e.t==='text'?e.text:e.t==='math'?e.tex:'';if(t&&t.toLowerCase().includes(q)){sn=t;break}}
  if(nm||sn)R.push(`<div class="pg" data-p="${p.id}" style="padding-left:10px"><span class="nm"><b>${esc(p.name)}</b> · ${esc(n.name)}${sn?'<br><small>'+esc(sn.slice(0,60))+'</small>':''}</span></div>`)}));
 $('#tree').innerHTML=R.join('')||'<div style="padding:8px;color:var(--mut)">No matches</div>'});
$('#tree').addEventListener('click',e=>{if(e.target.closest('[data-p]'))$('#srch').value=''});
$('#binbtn').onclick=()=>{S.view='bin';render()};
$('#toggle').onclick=()=>{$('#side').classList.toggle('hide');setTimeout(resize,0)};
if(innerWidth<=700)$('#side').classList.add('hide');
setTool('select');props();resize();load();boot=false;cloudInit();
document.fonts&&Promise.all(Object.values(FF).map(f=>document.fonts.load('500 20px '+f))).then(()=>{P().els.forEach(e=>e.t==='text'&&tfit(e));draw()});
</script></body></html>
